name: LiDAR Source Diagnostic

on:
  push:
    branches:
      - lidar-source-diagnostic-20260825

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Alpine edge PDAL CLI install
        shell: bash
        run: |
          set -euo pipefail
          docker pull alpine:edge
          docker run --name pdal-test alpine:edge sh -lc 'apk add --no-cache pdal && pdal --version && pdal --drivers | grep readers.las'
          docker commit pdal-test local-pdal:edge
          docker rm pdal-test
          docker run --rm local-pdal:edge pdal --version
