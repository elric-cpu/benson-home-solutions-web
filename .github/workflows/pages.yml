name: Deploy Prospecting Map to Pages

on:
  push:
    branches: [main]
    paths:
      - public/prospecting-map.html
      - public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static map
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate map payload
        run: |
          test -s public/prospecting-map.html
          test -s public/favicon.svg
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed map
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
            "${PAGE_URL}prospecting-map.html" \
            | grep -q '<title>Benson Prospecting GIS</title>'
