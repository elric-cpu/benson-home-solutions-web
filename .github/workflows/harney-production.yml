name: Harney Podcast Production Render

on:
  push:
    branches:
      - harney-podcast-automation
    paths:
      - "harney-podcast/episodes/**"
      - "harney-podcast/production/TRIGGER"
      - ".github/workflows/harney-production.yml"

permissions:
  contents: read

jobs:
  render_last_week:
    if: ${{ contains(github.event.head_commit.message, '[render-last-week]') }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: harney-podcast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Require Gemini API key
        shell: bash
        run: |
          test -n "${GEMINI_API_KEY:-}" || {
            echo "GEMINI_API_KEY Actions secret is missing."
            exit 2
          }

      - name: Validate locked scripts
        run: |
          python runner.py check-script episodes/2026-09-15-diaz/script_locked.txt
          python runner.py check-script episodes/2026-09-18-camp-harney/script_locked.txt

      - name: Render Sept 15 Diaz episode
        run: python runner.py produce episodes/2026-09-15-diaz/script_locked.txt production/2026-09-15-diaz

      - name: Render Sept 18 Camp Harney episode
        run: python runner.py produce episodes/2026-09-18-camp-harney/script_locked.txt production/2026-09-18-camp-harney

      - name: Upload finished episodes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harney-last-week-episodes
          path: |
            harney-podcast/production/2026-09-15-diaz/
            harney-podcast/production/2026-09-18-camp-harney/
          if-no-files-found: warn
          retention-days: 30
