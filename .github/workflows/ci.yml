name: CI — Lighthouse · Playwright · axe-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Start server & run tests
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm test
        env:
          NODE_ENV: production

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: $ env.NODE_VERSION 
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Run Lighthouse CI
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx @lhci/cli autorun
        env:
          NODE_ENV: production
