name: CI — Lighthouse · Playwright · axe-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  # Build env fallbacks (real values live in Vercel)
  NEXT_PUBLIC_SANITY_PROJECT_ID: 'PLACEHOLDER'
  NEXT_PUBLIC_SANITY_DATASET: 'production'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # TODO: Sprint 2 — remove soft-fail once scaffold pages have real types
      - name: TypeScript check (soft-fail)
        run: npx tsc --noEmit || echo "::warning::TypeScript check failed — soft-fail enabled for Sprint 1 scaffolds"
      # TODO: Sprint 2 — remove soft-fail once all files are properly linted
      - name: ESLint (soft-fail)
        run: npm run lint || echo "::warning::ESLint failed — soft-fail enabled for Sprint 1 scaffolds"
      # TODO: Sprint 2 — remove soft-fail once format is enforced on all files
      - name: Prettier check (soft-fail)
        run: npm run format:check || echo "::warning::Prettier check failed — soft-fail enabled for API-pushed code"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Start server & run tests
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm test
        env:
          NODE_ENV: production

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Run Lighthouse CI
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx @lhci/cli autorun
        env:
          NODE_ENV: production
