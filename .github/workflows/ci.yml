name: CI — Lighthouse · Playwright · axe-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  # Build env fallbacks (real values live in Vercel)
  NEXT_PUBLIC_SANITY_PROJECT_ID: 'PLACEHOLDER'
  NEXT_PUBLIC_SANITY_DATASET: 'production'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # TODO: Sprint 2 — remove soft-fail once scaffold pages have real types
      - name: TypeScript check (soft-fail)
        run: pnpm exec tsc --noEmit || echo "::warning::TypeScript check failed — soft-fail enabled for Sprint 1 scaffolds"
      # TODO: Sprint 2 — remove soft-fail once all files are properly linted
      - name: ESLint (soft-fail)
        run: pnpm lint || echo "::warning::ESLint failed — soft-fail enabled for Sprint 1 scaffolds"
      # TODO: Sprint 2 — remove soft-fail once format is enforced on all files
      - name: Prettier check (soft-fail)
        run: pnpm format:check || echo "::warning::Prettier check failed — soft-fail enabled for API-pushed code"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Start server & run tests
        run: |
          pnpm start &
          pnpm exec wait-on http://localhost:3000 --timeout 30000
          pnpm test
        env:
          NODE_ENV: production

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next
      - name: Run Lighthouse CI
        run: |
          pnpm start &
          pnpm exec wait-on http://localhost:3000 --timeout 30000
          pnpm exec lhci autorun
        env:
          NODE_ENV: production
