name: LiDAR QC Run

on:
  push:
    branches:
      - lidar-qc-run-20260825
  workflow_dispatch:

jobs:
  acquire-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Initialize workspace
        run: mkdir -p lidar_qc/laz lidar_qc/reports

      - name: Resolve exact 3DEP project and tile URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib
          out = pathlib.Path('lidar_qc/reports')
          lon, lat = -118.93389, 43.76949

          def get_json(url, params):
              full=url+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(full, headers={'User-Agent':'Benson-LiDAR-QC/1.1'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)

          # Probe both current 3DEP LPC index layers. These are diagnostic only;
          # TNMAccess below is the actual product acquisition source.
          arc_params={
              'where':'1=1','geometry':json.dumps({'x':lon,'y':lat,'spatialReference':{'wkid':4326}}),
              'geometryType':'esriGeometryPoint','inSR':'4326','spatialRel':'esriSpatialRelIntersects',
              'outFields':'*','returnGeometry':'false','f':'json'
          }
          for layer in (24,8):
              try:
                  arc=f'https://index.nationalmap.gov/arcgis/rest/services/3DEPElevationIndex/MapServer/{layer}/query'
                  project=get_json(arc, arc_params)
                  (out/f'project_query_layer_{layer}.json').write_text(json.dumps(project, indent=2))
                  print('3DEP index layer',layer,'features=',len(project.get('features',[])))
                  for f in project.get('features',[]): print(json.dumps(f.get('attributes',{}), indent=2))
              except Exception as e:
                  print('3DEP index diagnostic failed for layer',layer,repr(e))

          # Query a ~1 km box around the target point against the product catalog.
          bbox=f'{lon-0.006},{lat-0.006},{lon+0.006},{lat+0.006}'
          api='https://tnmaccess.nationalmap.gov/api/v1/products'
          results=[]
          for ds in ('Lidar Point Cloud (LPC)','Lidar Point Cloud (3DEP)'):
              try:
                  params={'datasets':ds,'bbox':bbox,'prodFormats':'LAS,LAZ','outputFormat':'JSON','max':200}
                  d=get_json(api,params)
                  d['queried_dataset']=ds; d['queried_bbox']=bbox
                  (out/('tnm_products_'+('lpc' if 'LPC' in ds else '3dep')+'.json')).write_text(json.dumps(d,indent=2))
                  print('TNM dataset',ds,'total=',d.get('total'),'items=',len(d.get('items',[])))
                  results.extend(d.get('items',[]))
              except Exception as e:
                  print('TNM query failed',ds,repr(e))
          # De-duplicate on URL/title.
          unique=[]; seen=set()
          for it in results:
              key=it.get('downloadURL') or it.get('title') or json.dumps(it,sort_keys=True)
              if key not in seen:
                  seen.add(key); unique.append(it)
          print('Intersecting TNM products:')
          for i,it in enumerate(unique): print(i,it.get('title'),it.get('downloadURL'))
          if not unique:
              raise SystemExit('TNM API returned no LPC products for the project focus box')

          def hay(it): return json.dumps(it,sort_keys=True).lower()
          strong=('2019','d19','north central oregon','northcentraloregon','central oregon','centraloregon','lot 6a','harney')
          selected=[it for it in unique if ('2019' in hay(it) or 'd19' in hay(it)) and any(t in hay(it) for t in strong[2:])]
          if not selected: selected=[it for it in unique if '2019' in hay(it) or 'd19' in hay(it)]
          if not selected:
              print('No explicit 2019 token in product records; refusing to silently select another acquisition.')
              raise SystemExit(2)

          urls=[]
          for it in selected:
              u=it.get('downloadURL')
              if u and ('.laz' in u.lower() or '.las' in u.lower()): urls.append(u)
          urls=list(dict.fromkeys(urls))
          if not urls: raise SystemExit('2019 products found but no LAS/LAZ downloadURL was returned')
          (out/'selected_products.json').write_text(json.dumps(selected,indent=2))
          pathlib.Path('lidar_qc/urls.txt').write_text('\n'.join(urls)+'\n')
          print('Selected URLs:'); print('\n'.join(urls))
          PY

      - name: Download selected LAZ/LAS source tile(s)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            name="$(basename "${url%%\?*}")"
            echo "Downloading $name"
            curl --fail --location --retry 5 --retry-delay 3 --continue-at - "$url" -o "lidar_qc/laz/$name"
          done < lidar_qc/urls.txt
          ls -lh lidar_qc/laz
          sha256sum lidar_qc/laz/* | tee lidar_qc/reports/SHA256SUMS.txt

      - name: Install and verify PDAL runtime
        shell: bash
        run: |
          docker pull pdal/pdal:2.10.0
          docker run --rm pdal/pdal:2.10.0 pdal --version | tee lidar_qc/reports/pdal-version.txt

      - name: Full-decode and point-cloud QC
        shell: bash
        run: |
          set -euo pipefail
          for f in lidar_qc/laz/*; do
            [ -f "$f" ] || continue
            b="$(basename "$f")"; stem="${b%.*}"
            echo "QC $b"
            docker run --rm -v "$PWD/lidar_qc:/data" pdal/pdal:2.10.0 pdal info "/data/laz/$b" --summary > "lidar_qc/reports/${stem}.summary.json"
            docker run --rm -v "$PWD/lidar_qc:/data" pdal/pdal:2.10.0 pdal info "/data/laz/$b" --metadata > "lidar_qc/reports/${stem}.metadata.json"
            docker run --rm -v "$PWD/lidar_qc:/data" pdal/pdal:2.10.0 pdal info "/data/laz/$b" --schema > "lidar_qc/reports/${stem}.schema.json"
            # Full file read/decode plus enumerated class/return counts.
            docker run --rm -v "$PWD/lidar_qc:/data" pdal/pdal:2.10.0 pdal info "/data/laz/$b" --stats --dimensions=Classification,ReturnNumber,NumberOfReturns --enumerate=Classification,ReturnNumber,NumberOfReturns > "lidar_qc/reports/${stem}.stats.json"
          done

      - name: Build class and density report
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('lidar_qc/reports'); reports=[]
          for sp in root.glob('*.stats.json'):
              stem=sp.name[:-11]
              stats=json.loads(sp.read_text()); summary=json.loads((root/f'{stem}.summary.json').read_text()); meta=json.loads((root/f'{stem}.metadata.json').read_text())
              sl=stats.get('stats',{}).get('statistic',[]); cls=next((s for s in sl if s.get('name')=='Classification'),{})
              counts={}
              for e in cls.get('counts',[]) or []:
                  try:k,v=e.split('/'); counts[str(int(float(k)))]=int(v)
                  except:pass
              total=int(cls.get('count') or sum(counts.values()) or 0); ground=int(counts.get('2',0))
              def fb(x):
                  if isinstance(x,dict):
                      if {'minx','maxx','miny','maxy'}<=set(x): return x
                      for v in x.values():
                          r=fb(v)
                          if r:return r
                  if isinstance(x,list):
                      for v in x:
                          r=fb(v)
                          if r:return r
              bounds=fb(summary); area=None
              if bounds: area=(float(bounds['maxx'])-float(bounds['minx']))*(float(bounds['maxy'])-float(bounds['miny']))
              text=json.dumps(meta); factor=None
              m=re.search(r'foot[^,]*,\\?"?([0-9]*\.?[0-9]+)',text,re.I)
              if m:
                  try: factor=float(m.group(1))
                  except: pass
              area_m2=area*factor*factor if area and factor else None
              reports.append({'tile':stem,'point_count':total,'classification_counts':counts,'ground_class_2_count':ground,'bounds':bounds,'area_native_sq_units':area,'unit_to_meter_factor':factor,'total_density_pts_m2':(total/area_m2 if area_m2 else None),'ground_density_pts_m2':(ground/area_m2 if area_m2 else None),'full_decode':'PASS'})
          if not reports: raise SystemExit('No PDAL stats reports produced')
          (root/'tile_qc_summary.json').write_text(json.dumps(reports,indent=2)); print(json.dumps(reports,indent=2))
          PY

      - name: Upload LAZ and QC evidence
        uses: actions/upload-artifact@v4
        with:
          name: idol-city-pardee-lidar-qc
          path: lidar_qc/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
