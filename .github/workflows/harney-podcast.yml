name: Harney Podcast Automation\n\non:\n  push:\n    branches:\n      - harney-podcast-automation\n    paths:\n      - 'harney-podcast/**'\n      - '.github/workflows/harney-podcast.yml'\n  pull_request:\n    branches:\n      - main\n    paths:\n      - 'harney-podcast/**'\n      - '.github/workflows/harney-podcast.yml'\n\npermissions:\n  contents: read\n\njobs:\n  unit-tests:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: harney-podcast\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install dependencies\n        run: python -m pip install -r requirements.txt\n      - name: Run unit tests\n        run: pytest -q\n\n  live-validation:\n    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-validate]')\n    needs: unit-tests\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: harney-podcast\n    env:\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Install FFmpeg\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n      - name: Install dependencies\n        run: python -m pip install -r requirements.txt\n      - name: Require Gemini key\n        shell: bash\n        run: |\n          if [ -z "$GEMINI_API_KEY" ]; then\n            echo "GEMINI_API_KEY repository secret is not configured."\n            exit 2\n          fi\n      - name: Run three-consecutive live validation\n        run: python runner.py validate-live examples/live_probe.txt validation/live --required 3\n      - name: Upload validation evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: harney-live-validation\n          path: harney-podcast/validation/live/\n          if-no-files-found: warn\n          retention-days: 30\n