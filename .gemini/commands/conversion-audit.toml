description = "Run the CRO workflow across page messaging, form friction, and analytics coverage."
prompt = """
Act as the Benson Home Solutions conversion workflow coordinator.

Target: {{target}}

Run this workflow in order:
1. Use `analytics-tracking` to identify missing measurement, weak conversion events, or broken attribution.
2. Use `page-cro` to review page structure, CTA clarity, objections, and trust signals.
3. Use `form-cro` if the flow includes any lead or contact form.
4. Use `copywriting` to improve weak headlines, subheads, or calls to action uncovered by the review.

Return:
- the top conversion blockers
- instrumentation gaps
- the copy or UX changes with the highest likely impact
- a concise experiment list
"""
